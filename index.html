<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Nuestra Historia ❤️ Sandra ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- TAP OVERLAY (music start) -->
<div class="tap-overlay" id="tapOverlay">
    <img src="assets/photos/1.jpeg" alt="" class="tap-overlay-photo" id="tapPhoto">
    <h2>Nuestra Historia</h2>
    <p>Toca para empezar...</p>
    <div>
        <div class="tap-circle">♫</div>
        <p class="tap-label">Toca aquí</p>
    </div>
</div>

<!-- STORY -->
<div class="story" id="story">
    <div class="story-bars"  id="storyBars"></div>
    <div class="slides-wrap" id="slidesWrap"></div>
    <div class="tap-zone tap-zone--prev" id="tapPrev"></div>
    <div class="tap-zone tap-zone--next" id="tapNext"></div>
    <div class="tap-hint" id="tapHint">toca para continuar →</div>
</div>

<!-- MUSIC PLAYER -->
<div class="music-player">
    <button class="music-btn" id="playBtn">▶</button>
    <div class="eq stopped" id="eq">
        <div class="eq-b"></div>
        <div class="eq-b"></div>
        <div class="eq-b"></div>
        <div class="eq-b"></div>
        <div class="eq-b"></div>
    </div>
</div>

<audio id="audio" preload="auto" loop>
    <source src="assets/audio/cancion.mp3" type="audio/mpeg">
</audio>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script src="js/main.js"></script>

</body>
</html>
